<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente de Voz — Logroño Deporte</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f6f5f1; color: #161a1d; padding: 20px;
    }
    .card {
      width: 100%; max-width: 380px; background: #fff; border-radius: 18px;
      padding: 32px 24px; text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; color: #b8292f; }
    p { margin: 0 0 24px; color: #5a626a; font-size: 0.95rem; }
    #estado {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      background: #eef2f6; font-size: 0.85rem; margin-bottom: 24px;
    }
    button {
      width: 100%; padding: 15px; border: 0; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer; color: #fff;
      background: #b8292f;
    }
    button.colgar { background: #161a1d; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Logroño Deporte</h1>
    <p>Asistente telefónico virtual de información deportiva</p>
    <div id="estado">Listo para llamar</div>
    <button id="btnLlamar">Iniciar llamada</button>
  </div>

  <script>
    let room = null;
    const btn = document.getElementById("btnLlamar");
    const estado = document.getElementById("estado");

    function limpiarAudios() {
      document.querySelectorAll("audio[data-lk]").forEach((el) => el.remove());
    }

    async function colgar() {
      if (room) {
        await room.disconnect();
        room = null;
      }
      limpiarAudios();
      estado.textContent = "Llamada finalizada";
      btn.textContent = "Iniciar llamada";
      btn.classList.remove("colgar");
      btn.disabled = false;
    }

    btn.addEventListener("click", async () => {
      if (room) {
        btn.disabled = true;
        await colgar();
        return;
      }

      btn.disabled = true;
      estado.textContent = "Conectando...";

      try {
        const resp = await fetch("/api/livekit-token");
        if (!resp.ok) throw new Error("No se pudo obtener el token");
        const { url, token } = await resp.json();

        room = new LivekitClient.Room();
        room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === LivekitClient.Track.Kind.Audio) {
            const el = track.attach();
            el.dataset.lk = "1";
            document.body.appendChild(el);
          }
        });
        room.on(LivekitClient.RoomEvent.Disconnected, () => colgar());

        await room.connect(url, token);
        await room.startAudio();
        await room.localParticipant.setMicrophoneEnabled(true);

        estado.textContent = "En llamada — puedes hablar";
        btn.textContent = "Colgar llamada";
        btn.classList.add("colgar");
        btn.disabled = false;
      } catch (err) {
        console.error(err);
        estado.textContent = "Error: " + err.message;
        await colgar();
      }
    });
  </script>
</body>
</html>
